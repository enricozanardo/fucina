# LIMEN-AI on-prem RTX factory (release / pull-by-tag form).
#
# Two services:
#   llama    - upstream llama.cpp CUDA server, GPU via NVIDIA Container Toolkit,
#              model read from ./models. Published on loopback only.
#   factory  - FastAPI KB factory image from GHCR, published on :8770. Set
#              LIMEN_FACTORY_BIND_IP to restrict which address that is.
#
#   docker compose --env-file docker/factory.env up -d
#
# For local development against the private accelerator tree, also pass
#   -f docker-compose.build.yml
# so the factory image is built from source instead of pulled.
#
# Model selection is shared state: the factory writes ./models/active_model.env
# and docker/llama-entrypoint.sh reloads llama-server when it changes.

services:
  llama:
    image: ${LIMEN_LLAMA_IMAGE:-ghcr.io/ggml-org/llama.cpp:server-cuda}
    entrypoint: ["/bin/sh", "/opt/limen/llama-entrypoint.sh"]
    volumes:
      - ./docker/llama-entrypoint.sh:/opt/limen/llama-entrypoint.sh:ro
      - ./models:/models:ro
    expose:
      - "8080"
    ports:
      # Loopback only. The factory reaches llama over the compose network as
      # http://llama:8080/v1, so this publish exists purely so an operator on the
      # host can curl /v1/models while debugging. It used to bind 0.0.0.0, which
      # offered an unauthenticated inference endpoint to the whole LAN.
      - "127.0.0.1:8080:8080"
    restart: unless-stopped
    gpus: all
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      LIMEN_MODELS_DIR: /models
      LIMEN_MODEL_FILE: ${LIMEN_MODEL_FILE:-}
      LIMEN_LLM_ALIAS: ${LIMEN_LLM_ALIAS:-qwen3-8b}
      LIMEN_LLAMA_CTX: ${LIMEN_LLAMA_CTX:-8192}
      LIMEN_LLAMA_NGL: ${LIMEN_LLAMA_NGL:-99}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  factory:
    image: ${LIMEN_FACTORY_IMAGE:-ghcr.io/enricozanardo/limen-factory:${LIMEN_VERSION:-5.2.3}}
    depends_on:
      - llama
    user: "${LIMEN_UID:-1000}:${LIMEN_GID:-1000}"
    environment:
      LIMEN_LLM_BASE_URL: http://llama:8080/v1
      LIMEN_LLM_MODEL: ${LIMEN_LLM_ALIAS:-qwen3-8b}
      LIMEN_FACTORY_CONFIG: /etc/limen/factory.yaml
      LIMEN_DOCKER_FACTORY: "1"
      LIMEN_MODELS_DIR: /models
      LIMEN_LLAMA_CTX: ${LIMEN_LLAMA_CTX:-8192}
      HOME: /tmp
      HF_HOME: /models/.hf_home
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: utility
      LIMEN_VRAM_TOTAL_MB: ${LIMEN_VRAM_TOTAL_MB:-}
      LIMEN_GPU_NAME: ${LIMEN_GPU_NAME:-}
    volumes:
      - ./docker/factory.compose.yaml:/etc/limen/factory.yaml:ro
      - ./data/factory:/opt/limen-factory/build/factory
      - ./models:/models
    ports:
      # The factory has no authentication of its own, so whatever this binds to
      # can build knowledge bases without credentials. 0.0.0.0 stays the default
      # because a self-hosted factory has to be reachable from the board across
      # the LAN, and that LAN is the operator's own.
      #
      # A shared deployment must NOT use the default: set LIMEN_FACTORY_BIND_IP to
      # the host's tailnet address so the only route in is the subscription
      # gateway (see gateway/), which authenticates and meters every request.
      - target: 8770
        published: 8770
        protocol: tcp
        host_ip: ${LIMEN_FACTORY_BIND_IP:-0.0.0.0}
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
